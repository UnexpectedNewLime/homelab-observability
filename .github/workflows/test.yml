name: Observability checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline unit tests and repository safety
        run: make test-unit check-safety
      - name: Isolated native configuration and alert-rule tests
        run: make test-config
