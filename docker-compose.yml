services:
  config-generator:
    image: python@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
    user: "1000:1000"
    container_name: config-generator
    env_file: .env
    entrypoint: ["python", "-B", "/scripts/generate-config.py", "--root", "/repo", "--output", "/repo"]
    volumes:
      - ./scripts:/scripts:ro
      - ./prometheus:/repo/prometheus
      - ./pve:/repo/pve
      - ./loki:/repo/loki
      - ./ntfy:/repo/ntfy
      - ./alloy:/repo/alloy
      - ./proxmox:/repo/proxmox

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      config-generator:
        condition: service_completed_successfully
      alertmanager:
        condition: service_started
      blackbox:
        condition: service_started
      pve-exporter:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - alert-dump

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Existing users/password hashes live in grafana-data. Bootstrap explicitly
      # on a fresh volume rather than silently creating a default-password admin.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    depends_on:
      - prometheus

  blackbox:
    image: quay.io/prometheus/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    cap_add:
      - NET_RAW
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    restart: unless-stopped
    # Generated token config is 0640, owned by deployment UID/GID 1000.
    group_add: ["1000"]
    depends_on:
      config-generator:
        condition: service_completed_successfully
    volumes:
      - ./pve/pve.yml:/etc/prometheus/pve.yml:ro

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  alert-dump:
    image: python:3.12-slim
    container_name: alert-dump
    restart: unless-stopped
    working_dir: /app
    command: python app.py
    volumes:
      - ./alert-dump:/app

  loki:
    image: grafana/loki@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki-ingress:
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports:
      - "${MONITORING_IP:?Set MONITORING_IP in .env}:3100:3100"
    volumes:
      - ./loki/ingress.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      config-generator:
        condition: service_completed_successfully
      loki:
        condition: service_started
    logging: *bounded-logging

  alloy:
    image: grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    command:
      - run
      - --stability.level=experimental
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      config-generator:
        condition: service_completed_successfully
      loki:
        condition: service_started
    logging: *bounded-logging

  ntfy-tailscale:
    image: tailscale/tailscale@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    hostname: watcher-alerts
    restart: unless-stopped
    environment:
      TS_HOSTNAME: watcher-alerts
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: "30m"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-ntfy-data:/var/lib/tailscale
      - ./tailscale-ntfy:/config:ro
    logging: *bounded-logging

  ntfy:
    image: binwiederhier/ntfy@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    restart: unless-stopped
    command: [serve]
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-data:/var/lib/ntfy
    logging: *bounded-logging
    depends_on:
      config-generator:
        condition: service_completed_successfully

  ntfy-bridge:
    image: python@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: [python, -B, -u, /app/app.py]
    environment:
      NTFY_BASE: http://ntfy:80
      NTFY_USER: alert-publisher
      NTFY_PASSWORD_FILE: /run/secrets/ntfy-publisher
    volumes:
      - ./ntfy-bridge:/app:ro
      - type: bind
        source: ${NTFY_CREDENTIALS_DIR:?Set NTFY_CREDENTIALS_DIR in .env}/ntfy-publisher.secret
        target: /run/secrets/ntfy-publisher
        read_only: true
        bind:
          create_host_path: false
    depends_on: [ntfy]
    logging: *bounded-logging

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
  ntfy-data:
  tailscale-ntfy-data:
