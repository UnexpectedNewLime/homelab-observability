global:
  resolve_timeout: 5m

route:
  receiver: alert-dump
  group_by: ["alertname", "instance", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: alert-dump
    webhook_configs:
      - url: http://alert-dump:8080/alertmanager
        send_resolved: true